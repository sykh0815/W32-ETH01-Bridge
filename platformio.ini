; WT32-ETH01 v1.4 - Ethernet-zu-WLAN-Bridge
; Benoetigt Arduino-Core 3.x (ESP-IDF 5) -> pioarduino-Plattform.
; Keine externen Bibliotheken: WiFi, WebServer, Preferences und ESP-IDF sind im Core enthalten.

[env:wt32-eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = wt32-eth01
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=3

; Port nur setzen, falls die automatische Erkennung nicht klappt
; (ls /dev/cu.* zeigt die Ports an):
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001
